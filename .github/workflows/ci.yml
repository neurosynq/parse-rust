name: ci

# Every step here also runs locally via `tools/test.sh`, and deliberately as the same commands
# rather than reimplemented ones, because duplicating them is how the two drift.
#
# **CI runs a subset, not the same set.** There is no upstream parse-server checkout here, only the
# `parse` npm SDK, so anything that boots a real parse-server cannot run: Gate B, Gate D, the
# upstream half of Gate C, and the differentials that compare against upstream's own modules
# (bcrypt interop, the MongoTransform oracle, the `_SCHEMA` format oracle). Each is named below
# where it would have run, so its absence is visible rather than assumed. A green run here
# therefore means less than a green `tools/test.sh`, and in particular says nothing about whether
# parse-rust and parse-server agree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (MongoDB ${{ matrix.mongodb }})
    runs-on: ubuntu-latest
    # Every supported server major, because behavior parse-rust depends on (index option
    # conflicts, error codes and messages, `explain` documents) is the server's and can move
    # between majors. `fail-fast` off, so one major failing still reports the other.
    strategy:
      fail-fast: false
      matrix:
        mongodb: ["7", "9"]
    # The adapter tests, the schema-format oracle and the acceptance gates all need a real
    # MongoDB. Mocking it would test that the mock behaves like the mock.
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7

      - name: install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # The number formatter is checked against Node rather than against expectations someone
      # typed in. This is the step that caught the ECMAScript tie-break rule, so it is not
      # optional here even though it is #[ignore]d in a plain `cargo test`.
      # `--skip` matches test *names*, not target file names, so the previous form here excluded
      # nothing and those tests ran (and would have failed) regardless. Select the targets
      # explicitly instead, which cannot silently do the wrong thing.
      #
      # Three `#[ignore]`d suites need the upstream checkout's `node_modules` to compare against
      # the real parse-server implementation: bcrypt interop, the MongoTransform oracle and the
      # `_SCHEMA` format oracle. Provisioning that is the next CI step; until then they are named
      # here as not-run rather than silently absent.
      - name: adapter integration (needs MongoDB)
        run: cargo test -p parse-rust-mongo --test adapter_integration -- --ignored

      - name: js_number differential (needs node only)
        run: cargo test -p parse-rust-core --test js_number_differential -- --ignored

      # Boots parse-rust on an ephemeral port and replays a spec file's assertions over HTTP.
      # Every assertion in these runners holds against real parse-server too, so a failure here
      # means parse-rust diverged rather than that the expectation was invented. Checks that
      # would NOT hold upstream, such as the `/serverInfo` capability values parse-rust
      # deliberately reports differently, live in the Rust tests instead.
      # The gates drive parse-rust through the unmodified `parse` npm SDK.
      # These are the exact versions carried by the pinned upstream checkout. A range here would
      # make CI's compatibility evidence change without a source change.
      - name: install the Parse SDK for the gates
        run: npm install --no-save parse@8.6.0 mongodb@7.1.0

      - name: conformance and acceptance gates
        env:
          # The gate scripts resolve the SDK from a parse-server checkout by default. On CI there
          # is none, so point them at the copy installed above.
          PARSE_SERVER_ROOT: ${{ github.workspace }}
        run: |
          # No `pipefail`. The address is read with `sed ... | head -1`, and `head` closing the pipe
          # early makes `sed` die on SIGPIPE, which under `pipefail` would fail the assignment and
          # take the step down on a successful boot.
          set -eu
          cargo build --workspace

          # Two servers are booted here, so the launch is a function rather than copied twice.
          # Each gets its own database and its own ephemeral port for the reason `tools/test.sh`
          # gives: a fixed one collides with another copy of itself and the failure reads as flake.
          # Sets BASE to the mount root. Any trailing NAME=VALUE arguments join the environment,
          # which is how the second server gets a different option without a second function.
          boot() {
            local tag="$1"; shift
            # `allowClientClassCreation` on, for the reason `tools/test.sh` gives: every gate script
            # boots its parse-server with it, and a differential run needs both sides to agree. The
            # shipped default is `false` and is asserted in the Rust tests, not here.
            env "$@" \
              PARSE_SERVER_APPLICATION_ID=test PARSE_SERVER_MASTER_KEY=test \
              PARSE_SERVER_ALLOW_CLIENT_CLASS_CREATION=true \
              PARSE_SERVER_MOUNT_PATH=/parse PORT=0 \
              PARSE_SERVER_DATABASE_URI="mongodb://127.0.0.1:27017/ci_${GITHUB_RUN_ID}_${tag}" \
              ./target/debug/parse-rust > "$tag.log" 2>&1 &
            # `if ... then break; fi` rather than `cond && break`, so the last command of the loop
            # body on a non-matching pass is the `sleep` rather than a failed test. Under `set -e`
            # the second form takes the whole step down on the iteration before the server is up.
            BASE=""
            for _ in $(seq 1 60); do
              BASE=$(sed -n 's|^parse-rust listening on \(http://[^ ]*\)$|\1|p' "$tag.log" | head -1)
              if [ -n "$BASE" ]; then break; fi
              sleep 0.5
            done
            test -n "$BASE" || { cat "$tag.log"; return 1; }
            for _ in $(seq 1 60); do
              if curl -fsS "$BASE/parse/health" >/dev/null 2>&1; then break; fi
              sleep 0.5
            done
          }

          MONGO_URI="mongodb://127.0.0.1:27017/ci_${GITHUB_RUN_ID}_default"
          boot default
          node tools/spec/features.spec.mjs "$BASE/parse"
          node tools/spec/poc-flow.mjs "$BASE/parse" test - test "$MONGO_URI"
          # Gate C without `--upstream`: the parse-rust half runs on the SDK alone. The upstream
          # half needs a checkout to boot a server out of, so it does not run here, and the whole
          # point of the gate is the comparison. Locally it runs both.
          node tools/spec/authorization.mjs "$BASE/parse" test test

          # The second regime. `enableSanitizedErrorResponse` puts a different set of messages on
          # the wire and both sets are contract, so running only the default here would leave half
          # of Gate C's parse-rust coverage unrun while the log still said "gate C". It needs a
          # second parse-rust with the option off and nothing else, so unlike the three below it
          # has no reason to be skipped on CI.
          boot detailed PARSE_SERVER_ENABLE_SANITIZED_ERROR_RESPONSE=false
          node tools/spec/authorization.mjs "$BASE/parse" test test --detailed

          # Named rather than dropped. All three need a parse-server checkout, which CI does not
          # have, and each is a claim CI is therefore not making.
          echo "not run here: gate B (data fidelity), it boots a parse-server"
          echo "not run here: gate C upstream half, in both regimes, so nothing above compares the two servers"
          echo "not run here: gate D (shared auth state), it boots a parse-server"

  citations:
    name: citations resolve at pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The code comments cite parse-server by file and line, and a citation that stops
      # resolving reads as verified when it is not. This checks the mechanical half.
      #
      # parse-server is public, so a shallow fetch of the pinned commit is enough. It is cloned
      # to ../parse-server because that is where the checker and every citation expect it.
      - name: read pin
        id: pin
        run: echo "commit=$(awk '/^parse-server /{print $3}' PIN)" >> "$GITHUB_OUTPUT"

      - name: fetch parse-server at the pin
        run: |
          git init ../parse-server
          git -C ../parse-server remote add origin https://github.com/parse-community/parse-server.git
          git -C ../parse-server fetch --depth 1 origin ${{ steps.pin.outputs.commit }}
          git -C ../parse-server checkout FETCH_HEAD

      - name: check citations
        run: python3 tools/check-citations.py
