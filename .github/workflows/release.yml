name: release

# Publishes the workspace to crates.io when a GitHub release is published.
#
# **Publishing is irreversible.** A version can be yanked but never deleted or replaced, and a
# crate name is claimed permanently. That shapes this workflow: it refuses to run unless the tag
# and the workspace version agree, it runs the test suite first, and `workflow_dispatch` performs
# a dry run rather than a publish so the whole path can be rehearsed without spending a version
# number.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "publish" to upload for real. Anything else is a dry run.'
        required: false
        default: 'dry-run'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Authentication: trusted publishing. **No API token is stored anywhere.**
#
# GitHub proves this workflow's identity over OIDC and crates.io exchanges that proof for a token
# valid about 30 minutes, scoped to this run. The action's post step revokes it when the job ends.
# A leaked build log is therefore worth nothing, and there is no secret to rotate.
#
# This requires a trusted publisher configured on crates.io **for each of the eight crates**,
# naming the repository `neurosynq/parse-rust`, the workflow file `release.yml`, and the
# environment `crates-io`. All three must match what this file declares, so renaming the file or
# the environment silently breaks publishing until the crates.io side is updated to match.
#
# 0.1.0 was published by hand, because a trusted publisher cannot be configured for a crate that
# does not exist yet: you have to own the crate before you can name who may publish it.

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Named in each crate's trusted publisher on crates.io, so the OIDC claim only validates for
    # runs in this environment. It also gives you a place to require a reviewer before publishing,
    # in repository settings, without touching this file.
    environment: crates-io
    permissions:
      contents: read
      # Required for the OIDC exchange. Without it the auth step fails with a missing-token error
      # rather than an authorization one, which is a confusing way to learn this is absent.
      id-token: write
    services:
      # `cargo test --workspace` includes integration tests that boot the server against a real
      # database. Publishing from an untested commit is how a broken version becomes permanent.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the main-branch check below needs the commit graph, and a shallow
          # clone cannot answer "is this commit an ancestor of main".
          fetch-depth: 0

      # **Publish only from main.** A GitHub release can be cut from a tag pointing at any
      # commit, including one on a branch that was never reviewed or merged. Checking
      # `target_commitish` is not enough: it holds whatever was selected in the UI and is the tag
      # name itself when the tag already existed. Asking the commit graph is the reliable form,
      # and it is worth doing because the upload it guards cannot be undone.
      - name: refuse to publish from anything but main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Releases publish from main only."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - name: install toolchain
        # `cargo publish --workspace` needs 1.90 or later. Older cargo publishes one crate at a
        # time and cannot resolve the sibling path dependencies during verification.
        run: |
          rustup update stable
          rustup default stable
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # The tag is the thing a human typed; the workspace version is the thing that gets
      # published. When they disagree the tag is a lie, and it is a lie that cannot be corrected
      # afterwards, so stop here rather than at the registry.
      - name: tag and workspace version must agree
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "tag=$TAG workspace=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: adapter integration (needs MongoDB)
        run: cargo test -p parse-rust-mongo --test adapter_integration -- --ignored

      # Always runs. Verifies every package builds from its own archive, in dependency order,
      # with the sibling paths stripped the way the registry will see them.
      - name: dry run
        run: cargo publish --workspace --dry-run

      # Exchanges the OIDC identity for a short-lived crates.io token. Deliberately placed after
      # the dry run and immediately before the upload, so the token's life covers the shortest
      # possible window and a failure in any earlier step never mints one.
      - name: authenticate to crates.io
        id: auth
        if: >-
          github.event_name == 'release' ||
          github.event.inputs.confirm_publish == 'publish'
        uses: rust-lang/crates-io-auth-action@v1

      - name: publish
        if: >-
          github.event_name == 'release' ||
          github.event.inputs.confirm_publish == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # crates.io rate-limits new crate names. If this stops partway, the crates that already
        # uploaded are published for good: do not re-run the whole job, publish the remainder
        # individually with `cargo publish -p <name>` in dependency order.
        run: cargo publish --workspace

      - name: not published
        if: >-
          github.event_name != 'release' &&
          github.event.inputs.confirm_publish != 'publish'
        run: echo "Dry run only. Re-run with confirm_publish=publish, or publish a release."
