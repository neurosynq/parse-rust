[package]
name = "parse-rust-bench"
description = "Benchmark harness for parse-rust against parse-server. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published, whatever the workspace says: this is a harness, not a library anyone depends on.
publish = false

[dependencies]
parse-rust-core.workspace = true
parse-rust-mongo.workspace = true
parse-rust-rest.workspace = true
parse-rust-storage.workspace = true
bson.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
http.workspace = true
hdrhistogram = "7"
sha2 = "0.11"
