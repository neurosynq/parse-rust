[package]
name = "parse-rust-rest"
version.workspace = true
description = "Parse read and write pipelines for parse-rust-server: schema validation, ACL enforcement, encoding."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
publish.workspace = true

[dependencies]
parse-rust-core.workspace = true
parse-rust-schema.workspace = true
parse-rust-storage.workspace = true
serde_json.workspace = true
indexmap.workspace = true
futures.workspace = true

[dev-dependencies]
# The pipeline is async, so its tests need a runtime. `rt` and `macros` only: the fake adapter in
# `crate::testing` never touches the network, so a multi-threaded runtime would buy nothing.
tokio = { workspace = true, features = ["rt", "macros"] }
