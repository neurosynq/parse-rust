[package]
name = "parse-rust-server"
version.workspace = true
description = "A Rust-native, embeddable implementation of the Parse Server API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
publish.workspace = true

[features]
# The conformance harness's control plane. Never enabled in a release build; see `src/harness.rs`.
test-harness = []
# Per-request database time as response headers, for the benchmark harness. Never in a release.
bench-instrumentation = ["parse-rust-mongo/bench-instrumentation"]

[dependencies]
parse-rust-core.workspace = true
parse-rust-rest.workspace = true
parse-rust-auth.workspace = true
parse-rust-schema.workspace = true
parse-rust-storage.workspace = true
parse-rust-mongo.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
indexmap.workspace = true
futures.workspace = true

[dev-dependencies]
tower.workspace = true
parse-rust-mongo.workspace = true
# The index tests assert against MongoDB's own catalogue rather than against `_SCHEMA`.
mongodb.workspace = true
bson.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
